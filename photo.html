<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея — DeviceClock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-content">
           <div class="logo">
    dev<span class="highlight">ICE</span>clock
</div>
            <nav>
                <a href="index.html">Главная</a>
                <a href="photo.html" class="active">Фото</a>
                <a href="manual.html">Инструкция</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="gallery-section">
            <h1>Галерея проекта</h1>
            <p class="subtitle">Фотографии готового устройства и процесса сборки.</p>

            <!-- Сюда JavaScript будет сам добавлять картинки -->
            <div class="photo-grid" id="gallery"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 deviceclock.ru. Сделано с любовью к электронике.</p>
    </footer>

    <script>
        // Укажи здесь, сколько ВСЕГО картинок у тебя сейчас в папке
        const totalPhotos = 6; 
        
        const galleryContainer = document.getElementById('gallery');

        for (let i = 1; i <= totalPhotos; i++) {
            // Создаем обертку для фото
            const photoCard = document.createElement('div');
            photoCard.className = 'photo-card-simple';

            // Создаем саму картинку
            const img = document.createElement('img');
            img.src = `photos/${i}.jpg`; // Путь к картинке в папке
            img.alt = `Фото проекта ${i}`;
            img.loading = 'lazy'; // Картинки будут подгружаться плавно при скролле

            // Собираем элементы вместе
            photoCard.appendChild(img);
            galleryContainer.appendChild(photoCard);
        }
    </script>
</body>
</html>
