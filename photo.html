<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея — devICEclock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">dev<span class="highlight">ICE</span>clock</div>
            <nav>
                <a href="index.html">Главная</a>
                <a href="photo.html" class="active">Фото</a>
                <a href="manual.html">Инструкция</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="gallery-section">
            <h1>Галерея проекта</h1>
            <p class="subtitle">Фотографии устройства, аксессуаров и процесса создания.</p>

            <!-- Основная сетка фото из папки photos -->
            <div class="photo-grid" id="gallery"></div>

            <!-- Новые блоки: Радиодатчик и Пульт -->
            <h2 style="margin-top: 60px; color: #fff;">Аксессуары</h2>
            <div class="photo-grid">
                <!-- Блок Радиодатчика -->
                <div class="photo-card-simple accessory">
                    <img src="photos/sensor.jpg" alt="Радиодатчик температуры" onerror="this.src='https://placeholder.com🌡️+Sensor'">
                    <div class="accessory-label">Радиодатчик температуры</div>
                </div>
                
                <!-- Блок Пульта управления -->
                <div class="photo-card-simple accessory">
                    <img src="photos/remote.jpg" alt="Беспроводной пульт" onerror="this.src='https://placeholder.com🎮+Remote'">
                    <div class="accessory-label">Беспроводной пульт</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 deviceclock.ru. Сделано с любовью к электронике.</p>
    </footer>

    <script>
        const totalPhotos = 6; // Твое текущее количество фото в папке photos
        const galleryContainer = document.getElementById('gallery');

        for (let i = 1; i <= totalPhotos; i++) {
            const photoCard = document.createElement('div');
            photoCard.className = 'photo-card-simple';
            const img = document.createElement('img');
            img.src = `photos/${i}.jpg`;
            img.alt = `Фото проекта ${i}`;
            img.loading = 'lazy';
            photoCard.appendChild(img);
            galleryContainer.appendChild(photoCard);
        }
    </script>
</body>
</html>
